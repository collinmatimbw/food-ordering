name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          curl -fsS --max-time 120 https://food-point-api.onrender.com/api/menu > /dev/null
          echo "API awake"
