name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API + Supabase storage
        run: |
          curl -fsS --max-time 120 https://food-point-api.onrender.com/api/health
          echo "API + storage awake"
