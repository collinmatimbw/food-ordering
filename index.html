<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#163832" />
    <title>Willis Lounge · Order, Deliver & Collect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      #wl-boot {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity 0.45s ease;
      }
      #wl-boot .wl-logo {
        width: 80px;
        height: 80px;
        object-fit: contain;
        animation: wl-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      @keyframes wl-pop {
        0% {
          transform: scale(0.8);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #wl-boot .wl-logo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Static Willis Lounge splash: paints instantly, JS fades it out -->
    <div id="wl-boot" aria-hidden="true">
      <img class="wl-logo" src="/logo/logoo.png" alt="Willis Lounge" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
